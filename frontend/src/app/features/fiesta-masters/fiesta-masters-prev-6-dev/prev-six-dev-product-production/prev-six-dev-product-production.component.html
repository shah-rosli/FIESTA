<app-page-title [PageTitle]="PageTitle"></app-page-title>

<section class="content">
  <div class="container-fluid">
    <div class="card">
      <div class="card-body resize-content">
        <app-filter-criteria [show]="showCriteria" [columns]="upperColumnsConfig"
          [fieldsDropdown]="criteriaFieldsDropdown" (onCriteriaRetrieved)="onCriteriaRetrieved($event)">
        </app-filter-criteria>
        <dx-resizable *ngIf="showUpperDataGrid" class="pb-2" handles="bottom" area=".resize-content" [minHeight]="200"
          [maxHeight]="1000" [height]="upperDataGridheight">
          <dx-data-grid class="overflow-auto" #upperDataGrid [dataSource]="upperDataSource" [remoteOperations]="true"
            [showBorders]="true" [showColumnLines]="true" [showRowLines]="true" [rowAlternationEnabled]="true"
            [allowColumnResizing]="true" [allowColumnReordering]="true" [columnMinWidth]="50" [columnAutoWidth]="true"
            [hoverStateEnabled]="true" columnResizingMode="widget" [columns]="upperColumnsConfig" height="100%"
            [filterSyncEnabled]="true" [(filterValue)]="upperDataGridFilterExp"
            (onRowClick)="onUpperDatagridRowClick($event)" (onContentReady)="selectFirstRow($event)"
            (onExporting)="onExporting($event, PageTitle)">

            <dxo-column-fixing [enabled]="true"></dxo-column-fixing>
            <dxo-scrolling [useNative]="true"></dxo-scrolling>
            <dxo-header-filter [visible]="true">
              <dxo-search [enabled]="true"></dxo-search>
            </dxo-header-filter>
            <dxo-filter-row [visible]="true"></dxo-filter-row>
            <dxo-paging [enabled]="true" [pageSize]="20"></dxo-paging>
            <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[10, 20, 30]" [showInfo]="true"
              [visible]="true">
            </dxo-pager>
            <dxo-group-panel [visible]="true"></dxo-group-panel>
            <dxo-editing mode="popup" refreshMode="full" [allowAdding]="false" [allowUpdating]="false"
              [allowDeleting]="false">
            </dxo-editing>
            <dxo-export [enabled]="true"></dxo-export>
            <dxo-sorting mode="multiple"></dxo-sorting>
            <dxo-column-chooser [enabled]="true" mode="select">
              <dxo-selection [allowSelectAll]="true"></dxo-selection>
              <dxo-search [enabled]="true"></dxo-search>
              <dxo-position my="right top" at="right bottom" of=".dx-datagrid-column-chooser-button"></dxo-position>
            </dxo-column-chooser>
            <dxo-filter-panel [visible]="true"></dxo-filter-panel>
            <dxo-selection mode="single"></dxo-selection>
            <dxo-toolbar>
              <dxi-item location="before" locateInMenu="auto">
                <dx-button text="Toggle Criteria" type="success" (onClick)="this.showCriteria = !this.showCriteria">
                </dx-button>
              </dxi-item>
              <dxi-item name="groupPanel" locateInMenu="auto"></dxi-item>
              <dxi-item [visible]="exportBtn.visible" locateInMenu="auto">
                <div *dxTemplate>
                  <dx-button id="popoverTarget" icon="download" [focusStateEnabled]="false" [text]="exportBtn.message"
                    (onClick)="exportBtnClick()">
                  </dx-button>
                  <dx-popover target="#popoverTarget" showEvent="mouseenter" hideEvent="mouseleave"
                    [animation]="{ hide: { type: 'pop', duration: 0 }, show: { type: 'pop', duration: 0 } }">
                    <div *dxTemplate="let data = model; of: 'content'">
                      This file is refreshed every 15 minutes
                    </div>
                    <dxo-show [duration]="0"></dxo-show>
                  </dx-popover>
                </div>
              </dxi-item>
              <dxi-item name="exportButton"></dxi-item>
              <dxi-item name="columnChooserButton"></dxi-item>
            </dxo-toolbar>
          </dx-data-grid>
        </dx-resizable>
        <div class="pt-2"></div>
        <dx-data-grid *ngIf="showLowerDataGrid" #lowerDataGrid [dataSource]="lowerDataSource" [remoteOperations]="true"
          [showBorders]="true" [showColumnLines]="true" [showRowLines]="true" [rowAlternationEnabled]="true"
          [allowColumnResizing]="true" [allowColumnReordering]="true" [columnMinWidth]="50" [columnAutoWidth]="true"
          [hoverStateEnabled]="true" columnResizingMode="widget" [columns]="lowerColumnsConfig" height="300px"
          [(filterValue)]="lowerDataGridFilterExp" (onExporting)="onExporting($event, PageTitle)">

          <dxo-column-fixing [enabled]="true"></dxo-column-fixing>
          <dxo-scrolling [useNative]="true"></dxo-scrolling>
          <dxo-header-filter [visible]="true">
            <dxo-search [enabled]="true"></dxo-search>
          </dxo-header-filter>
          <dxo-filter-row [visible]="true"></dxo-filter-row>
          <dxo-paging [enabled]="true" [pageSize]="10"></dxo-paging>
          <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[5, 10, 20]" [showInfo]="true" [visible]="true">
          </dxo-pager>
          <dxo-group-panel [visible]="true"></dxo-group-panel>
          <dxo-editing mode="popup" refreshMode="full" [allowAdding]="false" [allowUpdating]="false"
            [allowDeleting]="false">
          </dxo-editing>
          <dxo-export [enabled]="true"></dxo-export>
          <dxo-sorting mode="multiple"></dxo-sorting>
          <dxo-column-chooser [enabled]="true" mode="select">
            <dxo-selection [allowSelectAll]="true"></dxo-selection>
            <dxo-search [enabled]="true"></dxo-search>
            <dxo-position my="right top" at="right bottom" of=".dx-datagrid-column-chooser-button"></dxo-position>
          </dxo-column-chooser>
          <dxo-toolbar>
            <dxi-item name="groupPanel" locateInMenu="auto"></dxi-item>
            <dxi-item name="exportButton" locateInMenu="auto"></dxi-item>
            <dxi-item name="columnChooserButton" locateInMenu="auto"></dxi-item>
          </dxo-toolbar>
        </dx-data-grid>
      </div>
    </div>
  </div>
</section>
