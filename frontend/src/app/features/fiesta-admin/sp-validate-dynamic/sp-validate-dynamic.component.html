<app-page-title [PageTitle]="PageTitle"></app-page-title>

<section class="content">
  <app-no-view-permission *ngIf="!pagePermission.view"></app-no-view-permission>

  <div *ngIf="pagePermission.view" class="container-fluid">
    <div class="card">
      <div class="card-body">
        <form (submit)="onFormSubmit($event)">
          <dx-form [formData]="formData" labelLocation="top">
            <dxi-item itemType="group">
              <dxi-item itemType="group" [colCount]="2">
                <dxi-item [label]="{text: 'Validate'}" [isRequired]="true">
                  <div *dxTemplate>
                    <dx-select-box [items]="validateList" [searchEnabled]="true" [(value)]="formData.validateSelection">
                    </dx-select-box>
                  </div>
                </dxi-item>
              </dxi-item>
            </dxi-item>
            <dxi-item itemType="group" [colCount]="6">
              <dxi-item itemType="button" horizontalAlignment="left" [buttonOptions]="buttonOptions">
              </dxi-item>
            </dxi-item>
          </dx-form>
        </form>
        <dx-data-grid width="100%" [dataSource]="dataSource" [showBorders]="true" [showColumnLines]="true"
          [showRowLines]="true" [rowAlternationEnabled]="true" [allowColumnResizing]="true"
          [allowColumnReordering]="true" [columnMinWidth]="50" [columnAutoWidth]="true" [hoverStateEnabled]="true"
          columnResizingMode="widget" (onRowPrepared)="onRowPrepared($event)"
          (onExporting)="onExporting($event, PageTitle)">

          <dxo-column-fixing [enabled]="true"></dxo-column-fixing>
          <dxo-scrolling [useNative]="true"></dxo-scrolling>
          <dxo-header-filter [visible]="true">
            <dxo-search [enabled]="true"></dxo-search>
          </dxo-header-filter>
          <dxo-filter-row [visible]="true"></dxo-filter-row>
          <dxo-paging [enabled]="true" [pageSize]="30"></dxo-paging>
          <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[20, 30, 40]" [showInfo]="true" [visible]="true">
          </dxo-pager>
          <dxo-group-panel [visible]="true"></dxo-group-panel>
          <dxo-export [enabled]="true"></dxo-export>
          <dxo-sorting mode="multiple"></dxo-sorting>

          <dxi-column dataField="PARAM_KEY" caption="PARAM_KEY"></dxi-column>
          <dxi-column dataField="PARAM_VALUE" caption="PARAM_VALUE"></dxi-column>

        </dx-data-grid>
      </div>
    </div>
  </div>
</section>
