<app-page-title [PageTitle]="PageTitle"></app-page-title>

<section class="content">
  <div class="container-fluid">
    <div class="card">
      <div class="card-body datagrid-font-size">
        <dx-data-grid class="exclude-compact-datagrid" [dataSource]="dataSource" [showBorders]="true"
          [showColumnLines]="true" [showRowLines]="true" [rowAlternationEnabled]="true" [allowColumnResizing]="true"
          [allowColumnReordering]="true" [columnAutoWidth]="true" [hoverStateEnabled]="true" columnResizingMode="widget"
          (onCellPrepared)="onCellPrepared($event)">

          <dxo-column-fixing [enabled]="true"></dxo-column-fixing>
          <dxo-scrolling [useNative]="true"></dxo-scrolling>
          <dxo-header-filter [visible]="true">
            <dxo-search [enabled]="true"></dxo-search>
          </dxo-header-filter>
          <dxo-filter-row [visible]="true"></dxo-filter-row>
          <dxo-paging [pageSize]="1000"></dxo-paging>

          <dxo-toolbar>
            <dxi-item location="before" locateInMenu="auto">
              <div *dxTemplate>
                <div>The status refresh every minute</div>
              </div>
            </dxi-item>
            <dxi-item widget="dxButton" [options]="{
                        icon: 'refresh',
                        hint: 'Refresh',
                        onClick: getDataSource
                      }">
            </dxi-item>
          </dxo-toolbar>
          <dxi-column dataField="LOG_ID" caption="RunID" cssClass="left-bottom-header"></dxi-column>
          <dxi-column dataField="JOB_NAME" caption="Job Name" cssClass="left-bottom-header"></dxi-column>
          <dxi-column dataField="START_DATE" caption="Start Date Time" dataType="datetime" format="yyyy-MM-dd HH:mm"
            cssClass="left-bottom-header"></dxi-column>
          <dxi-column dataField="END_DATE" caption="End Date Time" dataType="datetime" format="yyyy-MM-dd HH:mm"
            cssClass="left-bottom-header"></dxi-column>
          <dxi-column dataField="DURATION_HOURS" caption="Duration" cssClass="left-bottom-header"></dxi-column>
          <dxi-column dataField="STATUS" caption="Status" cssClass="left-bottom-header"></dxi-column>


          <dxi-column dataField="SP_PLM_PRODUCTION_ST" caption="TRN_PRODUCTION" cssClass="rotated-header-lb"
